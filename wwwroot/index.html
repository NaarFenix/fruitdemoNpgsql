<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruit App</title>
    <!-- htmx -->
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 400px;
            margin: 60px auto;
            padding: 0 20px;
            color: #111;
            background: #fff;
        }

        h1, h2 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
        }

        h2 {
            margin-top: 2rem;
        }

        input, button {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 10px;
            box-sizing: border-box;
            font-size: 0.95rem;
            font-family: inherit;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        input:focus {
            outline: none;
            border-color: #000;
        }

        button {
            background: #111;
            color: #fff;
            border: none;
            cursor: pointer;
            font-weight: 500;
        }

        button:hover {
            background: #333;
        }

        #result {
            font-size: 0.875rem;
            color: #666;
            min-height: 1.2rem;
            margin-bottom: 1rem;
        }

        #showfruit {
            padding: 12px;
            border: 1px solid #eee;
            border-radius: 6px;
            background: #fafafa;
            max-height: 200px;
            overflow-y: auto;
            font-size: 0.9rem;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <h1>Fruit App</h1>
    
    <form hx-post="/fruits" hx-target="#result">
        <input name="name" placeholder="Enter fruit name..." required autocomplete="off">
        <button type="submit">Save Fruit</button>
        <div id="result"></div>
    </form>

    <h2>Fruit List</h2>
    <button hx-get="/getfruit" hx-target="#showfruit">Load Fruits</button>
    <div id="showfruit"></div>
</body>
</html>
