<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruit Sanctuary &mdash; Celestial Harvest</title>
    <!-- htmx -->
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <!-- Google Fonts: Playfair Display & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-obsidian: #090A0F;
            --bg-card: #12151E;
            --border-gold: rgba(212, 175, 55, 0.3);
            --border-gold-hover: rgba(212, 175, 55, 0.7);
            --text-primary: #F3F4F6;
            --text-muted: #9CA3AF;
            --accent-gold: #D4AF37;
            --accent-glow: rgba(212, 175, 55, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-obsidian);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(59, 36, 96, 0.25) 0%, transparent 60%),
                radial-gradient(circle at 20% 90%, rgba(20, 50, 40, 0.2) 0%, transparent 50%);
        }

        .sanctuary-container {
            width: 100%;
            max-width: 520px;
            background: var(--bg-card);
            border: 1px solid var(--border-gold);
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 30px var(--accent-glow);
            backdrop-filter: blur(10px);
            position: relative;
        }

        .sanctuary-container::before {
            content: '';
            position: absolute;
            top: -1px; 
            left: 20%; 
            right: 20%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
        }

        h1, h2 {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            color: var(--accent-gold);
            letter-spacing: 0.05em;
            margin-bottom: 1.25rem;
            font-size: 1.75rem;
            text-align: center;
        }

        h2 {
            margin-top: 2.5rem;
            font-size: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 2rem;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        input {
            width: 100%;
            padding: 0.875rem 1.125rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        input::placeholder {
            color: var(--text-muted);
        }

        input:focus {
            outline: none;
            border-color: var(--accent-gold);
            box-shadow: 0 0 15px var(--accent-glow);
            background: rgba(255, 255, 255, 0.05);
        }

        button {
            width: 100%;
            padding: 0.875rem 1.25rem;
            background: linear-gradient(135deg, #D4AF37 0%, #AA7C11 100%);
            color: #0B0C10;
            font-weight: 600;
            font-size: 1rem;
            font-family: inherit;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
            letter-spacing: 0.03em;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
            filter: brightness(1.1);
        }

        button:active {
            transform: translateY(0);
        }

        #result {
            margin-top: 0.5rem;
            text-align: center;
            font-size: 0.875rem;
            color: var(--accent-gold);
            min-height: 1.25rem;
        }

        #showfruit {
            margin-top: 1rem;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 1rem;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 0.95rem;
            line-height: 1.6;
        }

        #showfruit::-webkit-scrollbar {
            width: 6px;
        }
        #showfruit::-webkit-scrollbar-thumb {
            background: rgba(212, 175, 55, 0.2);
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="sanctuary-container">
        <h1>Celestial Harvest</h1>
        
        <form hx-post="/fruits" hx-target="#result">
            <input name="name" placeholder="Enter mythical fruit name..." required autocomplete="off">
            <button type="submit">Offer to Sanctuary</button>
            <div id="result"></div>
        </form>

        <h2>Sanctuary Vault</h2>
        <button hx-get="/getfruit" hx-target="#showfruit">Reveal Harvested Fruits</button>
        <div id="showfruit"></div>
    </div>
</body>
</html>
